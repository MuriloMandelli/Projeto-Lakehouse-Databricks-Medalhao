site_name: Lakehouse com Databricks e arquitetura medalhão
site_description: Trabalho 3 da disciplina de Engenharia de Dados (SATC)
site_author: Murilo Mandelli e Augusto Benedetti
site_url: https://murilomandelli.github.io/Projeto-Lakehouse-Databricks-Medalhao/
repo_url: https://github.com/MuriloMandelli/Projeto-Lakehouse-Databricks-Medalhao
repo_name: MuriloMandelli/Projeto-Lakehouse-Databricks-Medalhao
edit_uri: ""

nav:
  - Contexto do trabalho: index.md
  - Arquitetura medalhão: medalhao.md
  - Dados da Loja Virtual: dados.md
  - "Landing e Bronze": bronze.md
  - "Silver: Data Quality": silver.md
  - "Gold: modelo dimensional": gold.md
  - "Job: encadeamento": job.md
  - Referências: referencias.md

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pt
